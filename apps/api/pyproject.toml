[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wingsaver-api"
version = "0.1.0"
description = "WingSaver airline search API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "redis[hiredis]>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "PyJWT[crypto]>=2.8",
  "pwdlib[argon2]>=0.2.0",
  "structlog>=24.0",
  "sentry-sdk[fastapi]>=2.0",
  "python-ulid>=4.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "respx>=0.21",
  "fakeredis[lua]>=2.23",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wingsaver_api"]

[tool.hatch.build.targets.wheel.sources]
"src/wingsaver_api" = "wingsaver_api"

[tool.fastapi]
entrypoint = "wingsaver_api.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wingsaver_api"]
mypy_path = "src"
